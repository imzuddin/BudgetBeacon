services:
  api-service: 
    build: 
      context: ..
      dockerfile: api/Dockerfile.api
    container_name: api-service
    env_file:
      - ../config/.env 
    ports:
      - "${API_PORT}:8000"
    volumes:
      - ../api:/fastapi
      - ../config/settings.py:/fastapi/settings.py

  db-service:
    image: postgres:latest
    container_name: db-service
    restart: unless-stopped 
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - budget_postgres_data:/var/lib/postgresql

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT}:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=${POSTGRES_HOST}
    depends_on:
      - db-service

volumes:
  budget_postgres_data: